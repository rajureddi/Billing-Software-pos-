name: counterday
description: "A modern, offline-first billing & inventory software."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  sqlite3: ^3.5.2
  supabase_flutter: ^2.17.2
  uuid: ^4.6.0
  intl: ^0.20.3
  pdf: ^3.13.0
  printing: ^5.15.0
  file_picker: ^12.3.0
  image_picker: ^1.1.2
  image: ^4.5.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
